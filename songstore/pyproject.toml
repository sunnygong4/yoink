[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songstore"
version = "0.1.0"
description = "Song catalog + files shared by Yoinker (music) and the karaoke site"
requires-python = ">=3.11"
dependencies = ["opencc-python-reimplemented>=0.1.7", "httpx>=0.27"]

[tool.setuptools]
packages = ["songstore"]
