services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yoinker}
      POSTGRES_USER: ${POSTGRES_USER:-yoinker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yoinker} -d ${POSTGRES_DB:-yoinker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yoinker}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-yoinker}
      MEDIA_ROOT: /app/backend/media
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ORIGINS: https://${YOINKER_DOMAIN}
      PUBLIC_WEB_URL: https://${YOINKER_DOMAIN}
      API_BASE_URL: https://${YOINKER_DOMAIN}
      FFMPEG_LOCATION: /usr/bin/ffmpeg
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - media_data:/app/backend/media

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yoinker}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-yoinker}
      MEDIA_ROOT: /app/backend/media
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ORIGINS: https://${YOINKER_DOMAIN}
      PUBLIC_WEB_URL: https://${YOINKER_DOMAIN}
      API_BASE_URL: https://${YOINKER_DOMAIN}
      FFMPEG_LOCATION: /usr/bin/ffmpeg
      RUN_MIGRATIONS: "0"
    command: ["sh", "-c", "cd /app/backend && python run_worker.py"]
    volumes:
      - media_data:/app/backend/media

  web:
    build:
      context: .
      dockerfile: client-web/Dockerfile
      args:
        VITE_API_BASE_URL: https://${YOINKER_DOMAIN}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      YOINKER_DOMAIN: ${YOINKER_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
